name: Build and Deploy Website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  fix-sitemap-job:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode Repositori
        uses: actions/checkout@v4

      - name: Jalankan Sitemap Fixer v24
        uses: ./ # Memanggil action.yml milik Anda

      # ----------------------------------------------------
      # TEMPEL DI SINI (Robot Optimasi Gambar)
      # ----------------------------------------------------
      - name: Optimasi Gambar Otomatis
        uses: calibreapp/image-actions@main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          # Robot ini otomatis mengecilkan file PNG/JPG baru yang Anda upload

  deploy-job:
    needs: fix-sitemap-job
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ambil Kode Repositori
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
