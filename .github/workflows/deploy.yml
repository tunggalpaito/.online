name: Build and Deploy Website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ambil Kode Repositori
        uses: actions/checkout@v4

      - name: Jalankan Sitemap Fixer v24
        uses: ./ # Memanggil action.yml milik Anda

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact Website
        uses: actions/upload-pages-artifact@v3
        with:
          # Gunakan '.' jika action lokal Anda langsung memperbarui file di root folder,
          # atau ganti dengan folder hasil build (misal: './dist') jika ada proses build terpisah.
          path: '.'

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
