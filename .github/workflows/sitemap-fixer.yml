name: Otomatis Perbaiki Sitemap

# Atur kapan robot ini harus bekerja (misalnya setiap hari jam 12 malam, atau setiap ada update)
on:
  push:
    branches:
      - main # atau master, sesuaikan dengan nama branch utama kamu
  schedule:
    - cron: '0 0 * * *' # Berjalan otomatis setiap hari sekali

jobs:
  run-robot:
    runs-on: ubuntu-latest
    steps:
      # 1. Ambil kode terbaru dari repository kamu
      - name: Checkout Repository
        uses: actions/checkout@v5

      # 2. Siapkan lingkungan Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24' # Menggunakan Node.js yang stabil

      # 3. Jalankan file main.js buatanmu
      - name: Jalankan Perbaikan Sitemap
        run: node main.js

      # 4. Simpan/commit kembali hasilnya secara otomatis ke repository jika ada yang berubah
      - name: Simpan Perubahan Sitemap
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'bot@users.noreply.github.com'
          git diff --quiet || (git add sitemap.xml && git commit -m "🤖 Robot: Otomatis merapikan sitemap.xml" && git push)
