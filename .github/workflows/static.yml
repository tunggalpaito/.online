name: Ultimate Fast Deploy & Smart Fixer

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  smart-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Robot Siaga Cepat: Mengambil kode dari repository
      - name: Checkout Code Fast
        uses: actions/checkout@v4

      # 2. Menyiapkan mesin Node.js (bisa disesuaikan ke versi '24' jika diinginkan)
      - name: Setup Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 3. Menjalankan main.js (Robot Internal: Perbaikan HTML Atas-Tengah-Bawah + Sitemap + Robots.txt)
      - name: Run Internal Smart Fixer & Generators
        run: node main.js

      # 4. Robot Penuntas Error: Memeriksa apakah file utama aman sebelum di-upload
      - name: Error Handler & Validation Check
        run: |
          echo "Menjalankan pemeriksaan akhir..."
          if [ ! -f "index.html" ]; then
            echo "ERROR KRITIS: File index.html hilang atau gagal diproses!"
            exit 1
          fi
          if [ ! -f "sitemap.xml" ]; then
            echo "ERROR: Sitemap gagal dibuat!"
            exit 1
          fi
          echo "Semua sistem aman, bersih dari error, dan siap di-upload!"

      # 5. Robot Pengantar Cepat ke GitHub Pages
      - name: Configure Pages Environment
        uses: actions/configure-pages@v5

      - name: Fast Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Finalize Deployment
        id: deployment
        uses: actions/deploy-pages@v5
