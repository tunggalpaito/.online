name: Parallel Smart Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # --- TIM 1: ROBOT PEMROSES UTAMA (Menjalankan main.js untuk HTML & Sitemap) ---
  process-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: ''

      - name: Run main.js (HTML Fixer & Sitemap Generator)
        run: node main.js

      # Menyimpan hasil kerja Tim 1 agar bisa dipakai oleh Tim Deploy
      - name: Upload Processed Files
        uses: actions/upload-artifact@v4
        with:
          name: website-files
          path: '.'

  # --- TIM 2: ROBOT VALIDASI / PENUNTAS ERROR (Berjalan bersamaan mengecek sistem) ---
  validate-system:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Quick Error Check
        run: |
          echo "Robot Validasi Siaga: Memeriksa integritas dasar..."
          if [ ! -f "index.html" ]; then
            echo "PERINGATAN: index.html belum ada di branch utama!"
          fi
          echo "Validasi awal selesai tanpa hambatan."

  # --- TIM 3: ROBOT PENGANTAR (Deploy ke GitHub Pages setelah Tim 1 & 2 selesai) ---
  deploy-pages:
    needs: [process-files, validate-system] # Menunggu hasil kerja Tim 1 dan Tim 2
    runs-on: ubuntu-latest
    steps:
      - name: Download Processed Files
        uses: actions/download-artifact@v4
        with:
          name: website-files

      - name: Configure Pages Environment
        uses: actions/configure-pages@v5

      - name: Final Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
