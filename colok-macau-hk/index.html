    <script>
    document.addEventListener("DOMContentLoaded", function() {
        function processSmartFormulaEngine(resultsArray, explicitLatest) {
            if (!resultsArray || resultsArray.length === 0) {
                showErrorState("Data paito pada file kosong atau tidak valid.");
                return;
            }

            // 1. Ambil result terakhir secara dinamis dan pastikan masuk ke array kalkulasi
            let lastResult = explicitLatest && explicitLatest.length === 4 ? explicitLatest : resultsArray[resultsArray.length - 1];
            if (resultsArray[resultsArray.length - 1] !== lastResult) {
                resultsArray.push(lastResult);
            }

            // 2. Rumus Cerdas: Analisis Pergeseran Langkah & Bobot Traffic 2D Otomatis
            let pairScore = {};
            let digitScore = {};
            for(let i=0; i<=9; i++) digitScore[i] = 0;

            let analysisWindow = resultsArray.slice(-50); // Mengambil 50 result terakhir untuk rekam jejak trafik paling responsif
            let totalLen = analysisWindow.length;

            analysisWindow.forEach((res, index) => {
                let cleanRes = String(res).trim().replace(/\D/g, '');
                if (cleanRes.length !== 4) return;

                let d2 = cleanRes.slice(-2); // Ambil 2D murni (Kepala-Ekor)
                
                // Bobot eksponensial otomatis: Result yang paling baru diberi nilai pengaruh lebih tinggi
                let dynamicWeight = Math.pow((index + 1) / totalLen, 1.7);

                // Akumulasi skor kemunculan pasangan 2D berdasarkan rumus frekuensi
                pairScore[d2] = (pairScore[d2] || 0) + (10 * dynamicWeight);

                // Akumulasi skor digit individual untuk membentuk formula angka VS otomatis
                for (let digit of d2) {
                    digitScore[digit] += (5 * dynamicWeight);
                }
            });

            // Injeksi formula pergerakan result terakhir agar angka VS dan 2D selalu berubah total mengikuti pergantian result
            let lastTwo = lastResult.slice(-2);
            let d1Last = parseInt(lastTwo[0]);
            let d2Last = parseInt(lastTwo[1]);
            
            // Rumus matematika transisi otomatis berdasarkan result terbaru
            let formulaDerived1 = (d1Last + 7) % 10;
            let formulaDerived2 = (d2Last + 3) % 10;
            let formulaDerived3 = Math.abs(d1Last - d2Last);

            // Berikan bonus boost poin otomatis pada digit hasil rumus turunan
            digitScore[formulaDerived1] += 25;
            digitScore[formulaDerived2] += 25;
            digitScore[formulaDerived3] += 20;
            if(pairScore[lastTwo]) pairScore[lastTwo] += 30;

            // 3. Susun Angka VS Otomatis dari Hasil Perhitungan Rumus & Traffic
            let sortedDigits = Object.keys(digitScore).sort((a, b) => digitScore[b] - digitScore[a]);
            let group1 = sortedDigits.slice(0, 3).sort();
            let group2 = sortedDigits.slice(3, 6).sort();
            let patternStr = `${group1.join('')} vs ${group2.join('')}`;

            // 4. Generate Line 2D murni dari persilangan matriks grup (Tanpa Hardcode / Manual)
            let generatedLine2D = [];
            group1.forEach(g1 => {
                group2.forEach(g2 => {
                    let p1 = `${g1}${g2}`;
                    let p2 = `${g2}${g1}`;
                    if (!generatedLine2D.includes(p1)) generatedLine2D.push(p1);
                    if (!generatedLine2D.includes(p2)) generatedLine2D.push(p2);
                });
            });

            // 5. Urutkan pasangan 2D berdasarkan skor rumus tertinggi
            let sortedPairs = Object.keys(pairScore).sort((a, b) => pairScore[b] - pairScore[a]);
            
            // Saring Top 2D yang selaras dengan hasil kalkulasi otomatis
            // Mengambil tepat 1 angka tunggal yang ada di posisi nomor 3 (indeks ke-2)
let top2DArr = sortedPairs[2] ? [sortedPairs[6]] : [];

            let pressNumbers = [sortedPairs[29], sortedPairs[30]].filter(Boolean);
              // Angka Press Utama hasil kalkulasi otomatis

            let containerHtml = `
                <div class="result-box">RESULT HONGKONG TERAKHIR
                <br> ${lastResult}
                </div>
                <div class="source-tag"></div>

                <div class="section-heading"></div>

                <div class="line-text press-highlight">COLOK MACAU<br>  ${pressNumbers.join(' vs ')} </div>
                `;

            document.getElementById('main-prediction-content').innerHTML = containerHtml;
        }

        function showErrorState(msg) {
            document.getElementById('main-prediction-content').innerHTML = `
                <div style="text-align: center; color: var(--danger-color); padding: 25px; font-size: 0.9rem;">
                  
                </div>
            `;
        }

        // Cache Buster dinamis menggunakan timestamp agar selalu mengambil data dan memproses rumus terbaru secara real-time
        let scriptTag = document.createElement('script');
        scriptTag.src = '/result/hk.js?v=' + new Date().getTime();

        scriptTag.onload = function() {
            try {
                let rawPaitoString = typeof DATA_PAITO_HK !== 'undefined' ? DATA_PAITO_HK : window.DATA_PAITO_HK;
                let liveObj = typeof LIVE_RESULT_HK !== 'undefined' ? LIVE_RESULT_HK : (window.LIVE_RESULT_HK || {});
                let explicitLatest = liveObj.latestResult || "";

                let finalArray = [];

                if (typeof rawPaitoString === 'string') {
                    let splitItems = rawPaitoString.replace(/[\n\r]+/g, ',').split(',');
                    finalArray = splitItems
                        .map(i => i.trim().replace(/\D/g, ''))
                        .filter(i => i.length === 4);
                } else if (Array.isArray(rawPaitoString)) {
                    finalArray = rawPaitoString
                        .map(i => String(i).trim().replace(/\D/g, ''))
                        .filter(i => i.length === 4);
                }

                if (finalArray.length > 0) {
                    processSmartFormulaEngine(finalArray, explicitLatest);
                } else {
                    showErrorState("Variabel DATA_RESULT_HK tidak ditemukan atau isinya tidak valid.");
                }
            } catch (e) {
                showErrorState("Terjadi kesalahan saat memparsing struktur data JS.");
            }
        };

        scriptTag.onerror = function() {
            showErrorState("File /result/hk.js tidak ditemukan di server.");
        };

        document.head.appendChild(scriptTag);
    });
    </script>
