<style>:root{--bg-color:#000000;--card-bg:#0a0a0c;--card-border:#1a1a24;--accent-cyan:#00f2fe;--accent-neon:#00ff88;--text-main:#f1f5f9;--text-muted:#94a3b8;--color-sdy:#ff9f43;--color-sgp:#4facfe;--color-hk:#ff2a85}*{box-sizing:border-box;margin:0;padding:0}body{background-color:var(--bg-color);color:var(--text-main);font-family:'Plus Jakarta Sans',sans-serif;width:100vw;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between}header{background:rgba(10,10,12,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--card-border);padding:10px 15px;display:flex;justify-content:space-between;align-items:center;width:100%}.logo-area{display:flex;align-items:center;gap:8px;text-decoration:none}.logo-icon{font-size:18px;color:var(--accent-cyan);filter:drop-shadow(0 0 6px var(--accent-cyan))}.logo-text{font-family:Orbitron,sans-serif;font-weight:900;font-size:15px;background:linear-gradient(135deg,var(--accent-cyan),var(--color-sgp));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px}.container{width:100%;padding:8px;flex:1}.live-draw-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:12px;width:100%}.live-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:6px;padding:6px 2px;text-align:center;position:relative;overflow:hidden}.market-name{font-family:Orbitron,sans-serif;font-size:9px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.live-badge{display:inline-block;background:rgba(255,42,133,.2);color:var(--color-hk);border:1px solid rgba(255,42,133,.4);padding:1px 4px;border-radius:8px;font-size:7px;font-weight:700;margin-bottom:4px;text-transform:uppercase;visibility:hidden}.live-badge.active-blink{visibility:visible;animation:liveBlink .8s infinite alternate}@keyframes liveBlink{0%{opacity:.2}100%{opacity:1;box-shadow:0 0 6px var(--color-hk)}}.number-box-container{display:flex;justify-content:center;gap:2px}.num-box{width:18px;height:22px;background:#000;border:1px solid #1a1a24;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:Orbitron,sans-serif;font-size:11px;font-weight:700}.monthly-section{background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;padding:8px;width:100%;margin-bottom:12px}table.monthly-table{width:100%;border-collapse:collapse;table-layout:fixed;text-align:center;font-size:9px}table.monthly-table td,table.monthly-table th{padding:5px 1px;border:1px solid #16161f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}table.monthly-table th{background:#050507;font-family:Orbitron,sans-serif;font-weight:700;color:var(--accent-cyan);font-size:8px}.date-col{font-family:Orbitron,sans-serif;color:#fff;font-size:7px;background:#040406}.txt-sdy{color:var(--color-sdy);font-weight:600;font-family:Orbitron}.txt-sgp{color:var(--color-sgp);font-weight:600;font-family:Orbitron}.txt-hk{color:var(--color-hk);font-weight:600;font-family:Orbitron}.seo-content-section{background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;padding:10px;font-size:10px;color:var(--text-muted);line-height:1.4;width:100%}.seo-content-section h2,.seo-content-section h3{font-family:Orbitron,sans-serif;color:var(--accent-cyan);font-size:11px;margin-bottom:4px}.seo-content-section p{margin-bottom:6px}.keyword-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.keyword-tag{background:rgba(0,255,136,.05);border:1px solid rgba(0,255,136,.3);color:var(--accent-neon);padding:2px 6px;border-radius:4px;font-size:8px;font-family:Orbitron,sans-serif;text-shadow:0 0 5px rgba(0,255,136,.4)}footer{background:#050507;border-top:1px solid var(--card-border);padding:10px;text-align:center;color:var(--text-muted);font-size:9px;width:100%}</style>
</head>
<body>
<header>
<a href=https://tunggalpaito.online/ class=logo-area>
<i class="fa-solid fa-bolt-lightning logo-icon"></i>
<span class=logo-text>TUNGGAL PAITO</span>
</a>
<div style=font-family:Orbitron,sans-serif;font-size:10px;font-weight:700;color:var(--text-muted)>
LIVE DRAW & PAITO
</div>
</header>
<div class=container>
<div class=live-draw-grid id=liveDrawGrid></div>
<div class=monthly-section>
<table class=monthly-table id=monthlyTable>
<thead><tr><th>TGL</th><th>SYD</th><th>SDY-L</th><th>SGP</th><th>HK</th><th>HK-L</th></tr></thead>
<tbody></tbody>
</table>
</div>
<div class=seo-content-section>
<h2>Pusat Live Draw & Result Tercepat Resmi</h2>
<p>Selamat datang di <strong>Tunggal Paito</strong>, situs penyedia informasi live draw pasaran resmi terlengkap dan terakurat.</p>
</div>
</div>
<footer>
<p>&copy; <span id=year></span> <span>TUNGGAL PAITO</span> All Rights Reserved.</p>
</footer>
<script src=/result/sdy.js?v=99></script>
<script src=/result/sdylotto.js?v=99></script>
<script src=/result/sgp.js?v=99></script>
<script src=/result/hk.js?v=99></script>
<script src=/result/hklotto.js?v=99></script>
<script>
function parseData(e){return Array.isArray(e)?e:(e?e.split(",").map(i=>i.trim()):[])}
function renderApp(){const e=[{key:"sdy",name:"SYDNEY",live:"undefined"!=typeof LIVE_RESULT_SDY?LIVE_RESULT_SDY.latestResult:"----",color:"var(--color-sdy)"},{key:"sdylotto",name:"SDY LOTTO",live:"undefined"!=typeof LIVE_RESULT_SDYLOTTO?LIVE_RESULT_SDYLOTTO.latestResult:"----",color:"var(--color-sdy)"},{key:"sgp",name:"SINGAPORE",live:"undefined"!=typeof LIVE_RESULT_SGP?LIVE_RESULT_SGP.latestResult:"----",color:"var(--color-sgp)"},{key:"hk",name:"HONGKONG",live:"undefined"!=typeof LIVE_RESULT_HK?LIVE_RESULT_HK.latestResult:"----",color:"var(--color-hk)"},{key:"hklotto",name:"HK LOTTO",live:"undefined"!=typeof LIVE_RESULT_HKLOTTO?LIVE_RESULT_HKLOTTO.latestResult:"----",color:"var(--color-hk)"}];document.getElementById("liveDrawGrid").innerHTML=e.map((e=>{return`<div class="live-card"><div class="market-name" style="color:${e.color}">${e.name}</div><div class="number-box-container">${e.live.split("").map(t=>`<div class="num-box" style="color:${e.color}">${t}</div>`).join("")}</div></div>`})).join("")}

document.addEventListener("DOMContentLoaded",()=>{
    renderApp();
    const e=parseData(typeof DATA_PAITO_SDY!=="undefined"?DATA_PAITO_SDY:[]).reverse();
    const t=parseData(typeof DATA_PAITO_SDYLOTTO!=="undefined"?DATA_PAITO_SDYLOTTO:[]).reverse();
    const n=parseData(typeof DATA_PAITO_SGP!=="undefined"?DATA_PAITO_SGP:[]).reverse();
    const s=parseData(typeof DATA_PAITO_HK!=="undefined"?DATA_PAITO_HK:[]).reverse();
    const l=parseData(typeof DATA_PAITO_HKLOTTO!=="undefined"?DATA_PAITO_HKLOTTO:[]).reverse();
    const a=document.querySelector("#monthlyTable tbody");
    const r=new Date, o=60*r.getHours()+r.getMinutes(), d=o>=840, T=o>=1095, i=o>=1395;
    let L=0;
    for(let r=0; r<15; r++){
        let dDate=new Date(); dDate.setDate(dDate.getDate()-r);
        let u=`${String(dDate.getDate()).padStart(2,"0")}-${String(dDate.getMonth()+1).padStart(2,"0")}`, day=dDate.getDay();
        let c=d?(r==0?("undefined"!=typeof LIVE_RESULT_SDY?LIVE_RESULT_SDY.latestResult:e[0]):e[r]):e[r]||"----";
        let E=d?(r==0?("undefined"!=typeof LIVE_RESULT_SDYLOTTO?LIVE_RESULT_SDYLOTTO.latestResult:t[0]):t[r]):t[r]||"----";
        let f=(day==2||day==5)?"LIBUR":((r==0&&T)?("undefined"!=typeof LIVE_RESULT_SGP?LIVE_RESULT_SGP.latestResult:n[L]):(n[L]||"----"));
        if(day!=2&&day!=5) L++;
        let O=i?(r==0?("undefined"!=typeof LIVE_RESULT_HK?LIVE_RESULT_HK.latestResult:s[0]):s[r]):"----";
        let D=i?(r==0?("undefined"!=typeof LIVE_RESULT_HKLOTTO?LIVE_RESULT_HKLOTTO.latestResult:l[0]):l[r]):"----";
        a.innerHTML+=`<tr><td class="date-col">${u}</td><td class="txt-sdy">${c}</td><td class="txt-sdy">${E}</td><td class="txt-sgp">${f}</td><td class="txt-hk">${O}</td><td class="txt-hk">${D}</td></tr>`;
    }
}))
</script>
</body>
</html>
