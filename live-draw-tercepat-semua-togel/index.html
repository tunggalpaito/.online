<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Draw Tercepat & Paito Warna Resmi - TUNGGAL PAITO</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0a0a0c;
            --card-border: #1a1a24;
            --accent-cyan: #00f2fe;
            --accent-neon: #00ff88;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --color-sdy: #ff9f43; 
            --color-sgp: #4facfe; 
            --color-hk: #ff2a85;  
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            width: 100vw;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            background: rgba(10, 10, 12, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-border);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .logo-area { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .logo-icon { font-size: 18px; color: var(--accent-cyan); filter: drop-shadow(0 0 6px var(--accent-cyan)); }
        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 15px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--color-sgp));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container { width: 100%; padding: 8px; flex: 1; }

        .live-draw-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-bottom: 12px;
            width: 100%;
        }

        .live-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 6px 2px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .market-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            font-weight: 700;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .live-badge {
            display: none; 
            background: rgba(255, 42, 133, 0.2);
            color: var(--color-hk);
            border: 1px solid rgba(255, 42, 133, 0.4);
            padding: 1px 4px;
            border-radius: 8px;
            font-size: 7px;
            font-weight: 700;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .live-badge.active-blink {
            display: inline-block; 
            animation: liveBlink 0.6s infinite alternate;
        }

        @keyframes liveBlink {
            0% { opacity: 0.1; }
            100% { opacity: 1; box-shadow: 0 0 8px var(--color-hk); }
        }

        .number-box-container { display: flex; justify-content: center; gap: 2px; }
        .num-box {
            width: 18px;
            height: 22px;
            background: #000000;
            border: 1px solid #1a1a24;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
        }

        .monthly-section {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 8px;
            width: 100%;
            margin-bottom: 12px;
        }

        table.monthly-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            text-align: center;
            font-size: 9px;
        }

        table.monthly-table th, table.monthly-table td {
            padding: 5px 1px;
            border: 1px solid #16161f;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        table.monthly-table th {
            background: #050507;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: var(--accent-cyan);
            font-size: 8px;
        }

        .date-col { font-family: 'Orbitron', sans-serif; color: #ffffff; font-size: 7px; background: #040406; }
        .txt-sdy { color: var(--color-sdy); font-weight: 600; font-family: 'Orbitron'; }
        .txt-sgp { color: var(--color-sgp); font-weight: 600; font-family: 'Orbitron'; }
        .txt-hk  { color: var(--color-hk); font-weight: 600; font-family: 'Orbitron'; }

        footer {
            background: #050507;
            border-top: 1px solid var(--card-border);
            padding: 10px;
            text-align: center;
            color: var(--text-muted);
            font-size: 9px;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <a href="https://tunggalpaito.online/" class="logo-area">
            <i class="fa-solid fa-bolt-lightning logo-icon"></i>
            <span class="logo-text">TUNGGAL PAITO</span>
        </a>
        <div style="font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 700; color: var(--text-muted);">
            LIVE DRAW & PAITO
        </div>
    </header>

    <div class="container">
        <div class="live-draw-grid" id="liveDrawGrid"></div>

        <div class="monthly-section">
            <table class="monthly-table" id="monthlyTable">
                <thead>
                    <tr>
                        <th>TGL</th>
                        <th>SYD</th>
                        <th>SDY-L</th>
                        <th>SGP</th>
                        <th>HK</th>
                        <th>HK-L</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <footer>
        <p>&copy; <span id="year"></span> <span>TUNGGAL PAITO</span> All Rights Reserved.</p>
        <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
    </footer>

    <!-- Script Data Paito & Live Result -->
    <script src="/result/sdy.js"></script>
    <script src="/result/sdylotto.js"></script>
    <script src="/result/sgp.js"></script>
    <script src="/result/hk.js"></script>
    <script src="/result/hklotto.js"></script>

    <script>
        function parseData(str) {
            if (!str) return [];
            let rawItems = str.split(',');
            let cleaned = [];
            for (let item of rawItems) {
                let match = item.match(/\d{4}/);
                if (match) {
                    cleaned.push(match[0]);
                }
            }
            return cleaned;
        }

        function isMarketUpdated(marketObj, paitoStr) {
            if (typeof marketObj !== 'undefined' && marketObj.latestResult) {
                let cleanRes = String(marketObj.latestResult).trim();
                if (cleanRes !== "" && cleanRes !== "----") return cleanRes;
            }
            let arr = parseData(paitoStr);
            if (arr.length > 0) {
                return arr[arr.length - 1];
            }
            return false;
        }

        function checkLiveStatus(marketKey, marketObj, paitoStr) {
            const now = new Date();
            const totalMinutes = now.getHours() * 60 + now.getMinutes();
            const day = now.getDay();

            let start = 0;
            if (marketKey === 'sdy') start = 13 * 60 + 45;       
            else if (marketKey === 'sdylotto') start = 13 * 60 + 55; 
            else if (marketKey === 'sgp') {
                if (day === 2 || day === 5) return false; 
                start = 17 * 60 + 45; 
            }
            else if (marketKey === 'hk') start = 22 * 60 + 50;       
            else if (marketKey === 'hklotto') start = 22 * 60 + 55;  

            let end = start + 30;
            let isTimeInRange = (totalMinutes >= start && totalMinutes < end);
            let alreadyUpdated = (isMarketUpdated(marketObj, paitoStr) !== false);

            return isTimeInRange && !alreadyUpdated;
        }

        function renderApp() {
            const markets = [
                { key: 'sdy', name: "SYDNEY", paito: typeof DATA_PAITO_SDY !== 'undefined' ? DATA_PAITO_SDY : "", liveObj: window.LIVE_RESULT_SDY, color: "var(--color-sdy)" },
                { key: 'sdylotto', name: "SDY LOTTO", paito: typeof DATA_PAITO_SDYLOTTO !== 'undefined' ? DATA_PAITO_SDYLOTTO : "", liveObj: window.LIVE_RESULT_SDYLOTTO, color: "var(--color-sdy)" },
                { key: 'sgp', name: "SINGAPORE", paito: typeof DATA_PAITO_SGP !== 'undefined' ? DATA_PAITO_SGP : "", liveObj: window.LIVE_RESULT_SGP, color: "var(--color-sgp)" },
                { key: 'hk', name: "HONGKONG", paito: typeof DATA_PAITO_HK !== 'undefined' ? DATA_PAITO_HK : "", liveObj: window.LIVE_RESULT_HK, color: "var(--color-hk)" },
                { key: 'hklotto', name: "HK LOTTO", paito: typeof DATA_PAITO_HKLOTTO !== 'undefined' ? DATA_PAITO_HKLOTTO : "", liveObj: window.LIVE_RESULT_HKLOTTO, color: "var(--color-hk)" }
            ];

            const grid = document.getElementById("liveDrawGrid");
            grid.innerHTML = markets.map(m => {
                let displayNum = "----";
                let updatedVal = isMarketUpdated(m.liveObj, m.paito);
                
                if (updatedVal !== false) {
                    displayNum = updatedVal;
                }

                let isLive = checkLiveStatus(m.key, m.liveObj, m.paito);
                let blinkClass = isLive ? "active-blink" : "";
                let digits = displayNum.split('').map(c => `<div class="num-box" style="color:${m.color}">${c}</div>`).join('');
                
                return `
                    <div class="live-card">
                        <div class="market-name" style="color:${m.color}">${m.name}</div>
                        <div class="live-badge ${blinkClass}">LIVE</div>
                        <div class="number-box-container">${digits}</div>
                    </div>
                `;
            }).join('');
        }

        function renderTable() {
            const sdyArr  = parseData(typeof DATA_PAITO_SDY !== 'undefined' ? DATA_PAITO_SDY : "");
            const sdylArr = parseData(typeof DATA_PAITO_SDYLOTTO !== 'undefined' ? DATA_PAITO_SDYLOTTO : "");
            const sgpArr  = parseData(typeof DATA_PAITO_SGP !== 'undefined' ? DATA_PAITO_SGP : "");
            const hkArr   = parseData(typeof DATA_PAITO_HK !== 'undefined' ? DATA_PAITO_HK : "");
            const hklArr  = parseData(typeof DATA_PAITO_HKLOTTO !== 'undefined' ? DATA_PAITO_HKLOTTO : "");

            const tbody = document.querySelector("#monthlyTable tbody");
            tbody.innerHTML = "";

            for(let i = 0; i < 15; i++) {
                let d = new Date();
                d.setDate(d.getDate() - i);
                
                let formattedDate = `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`;
                let dayOfWeek = d.getDay(); // 0: Min, 1: Sen, 2: Sel, 3: Rab, 4: Kam, 5: Jum, 6: Sab

                let sdyDisplay = "----";
                let sdyTargetIdx = sdyArr.length - 1 - i;
                if (sdyTargetIdx >= 0 && sdyTargetIdx < sdyArr.length) {
                    sdyDisplay = sdyArr[sdyTargetIdx];
                }

                let sdylDisplay = "----";
                let sdylTargetIdx = sdylArr.length - 1 - i;
                if (sdylTargetIdx >= 0 && sdylTargetIdx < sdylArr.length) {
                    sdylDisplay = sdylArr[sdylTargetIdx];
                }

                let sgpDisplay = "";
                if (dayOfWeek === 2 || dayOfWeek === 5) {
                    sgpDisplay = "LIBUR";
                } else {
                    // PEMETAAN OTOMATIS BERDASARKAN HARI EFEKTIF BUKA PASARAN SGP:
                    // Mencari elemen data array paito terakhir yang berpasangan langsung dengan tanggal 17 Agustus 2026 (Senin)
                    // dan bergerak mundur hanya melewati hari-hari buka pasaran (mengabaikan Selasa & Jumat).
                    let activeMarketDaysBack = 0;
                    for (let k = 0; k <= i; k++) {
                        let pastD = new Date();
                        pastD.setDate(pastD.getDate() - k);
                        let pdw = pastD.getDay();
                        if (pdw !== 2 && pdw !== 5) {
                            activeMarketDaysBack++;
                        }
                    }
                    let sgpTargetIdx = (sgpArr.length - 1) - (activeMarketDaysBack - 1);
                    if (sgpTargetIdx >= 0 && sgpTargetIdx < sgpArr.length) {
                        sgpDisplay = sgpArr[sgpTargetIdx];
                    } else {
                        sgpDisplay = "----";
                    }
                }

                let hkDisplay = "----";
                let hkTargetIdx = hkArr.length - 1 - i;
                if (hkTargetIdx >= 0 && hkTargetIdx < hkArr.length) {
                    hkDisplay = hkArr[hkTargetIdx];
                }

                let hklDisplay = "----";
                let hklTargetIdx = hklArr.length - 1 - i;
                if (hklTargetIdx >= 0 && hklTargetIdx < hklArr.length) {
                    hklDisplay = hklArr[hklTargetIdx];
                }

                tbody.innerHTML += `
                    <tr>
                        <td class="date-col">${formattedDate}</td>
                        <td class="txt-sdy">${sdyDisplay}</td>
                        <td class="txt-sdy">${sdylDisplay}</td>
                        <td class="txt-sgp">${sgpDisplay}</td>
                        <td class="txt-hk">${hkDisplay}</td>
                        <td class="txt-hk">${hklDisplay}</td>
                    </tr>
                `;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderApp();
            renderTable();
            setInterval(() => {
                renderApp();
                renderTable();
            }, 10000);
        });
    </script>
</body>
</html>
