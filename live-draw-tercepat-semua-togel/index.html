<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Live Draw Tercepat & Paito Warna Resmi - TUNGGAL PAITO</title>
<style>
:root{--bg-color:#000000;--card-bg:#0a0a0c;--card-border:#1a1a24;--accent-cyan:#00f2fe;--accent-neon:#00ff88;--text-main:#f1f5f9;--text-muted:#94a3b8;--color-sdy:#ff9f43;--color-sgp:#4facfe;--color-hk:#ff2a85}
*{box-sizing:border-box;margin:0;padding:0}
body{background-color:var(--bg-color);color:var(--text-main);font-family:'Plus Jakarta Sans',sans-serif;width:100vw;min-height:100vh;display:flex;flex-direction:column}
header{background:rgba(10,10,12,.9);border-bottom:1px solid var(--card-border);padding:15px;text-align:center}
.logo-text{font-family:Orbitron,sans-serif;font-weight:900;font-size:18px;background:linear-gradient(135deg,var(--accent-cyan),var(--color-sgp));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.container{width:100%;padding:10px}
.live-draw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:15px}
.live-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;padding:10px;text-align:center}
.market-name{font-size:10px;font-weight:700;margin-bottom:5px;font-family:Orbitron,sans-serif}
.num-box{width:20px;height:24px;background:#000;border:1px solid #1a1a24;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:Orbitron,sans-serif}
.monthly-section{background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;padding:10px}
table.monthly-table{width:100%;border-collapse:collapse;table-layout:fixed;text-align:center;font-size:10px}
table.monthly-table td,table.monthly-table th{padding:6px 2px;border:1px solid #16161f}
table.monthly-table th{background:#050507;color:var(--accent-cyan)}
.date-col{color:#fff;background:#040406;font-family:Orbitron,sans-serif}
.txt-sdy{color:var(--color-sdy)}.txt-sgp{color:var(--color-sgp)}.txt-hk{color:var(--color-hk)}
</style>
</head>
<body>
<header>
<span class="logo-text">TUNGGAL PAITO</span>
</header>
<div class="container">
    <div class="live-draw-grid" id="liveDrawGrid"></div>
    <div class="monthly-section">
        <table class="monthly-table" id="monthlyTable">
            <thead><tr><th>TGL</th><th>SYD</th><th>SDY-L</th><th>SGP</th><th>HK</th><th>HK-L</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script src="/result/sdy.js?v=2"></script>
<script src="/result/sdylotto.js?v=2"></script>
<script src="/result/sgp.js?v=2"></script>
<script src="/result/hk.js?v=2"></script>
<script src="/result/hklotto.js?v=2"></script>

<script>
function parseData(e){
    if(Array.isArray(e)) return e;
    return e ? e.split(",").map(i => i.trim()).filter(i => i.length > 0) : [];
}

function renderApp(){
    const data = [
        {key:"sdy", name:"SYDNEY", live:typeof LIVE_RESULT_SDY!=="undefined"?LIVE_RESULT_SDY.latestResult:"----", color:"var(--color-sdy)"},
        {key:"sdylotto", name:"SDY LOTTO", live:typeof LIVE_RESULT_SDYLOTTO!=="undefined"?LIVE_RESULT_SDYLOTTO.latestResult:"----", color:"var(--color-sdy)"},
        {key:"sgp", name:"SINGAPORE", live:typeof LIVE_RESULT_SGP!=="undefined"?LIVE_RESULT_SGP.latestResult:"----", color:"var(--color-sgp)"},
        {key:"hk", name:"HONGKONG", live:typeof LIVE_RESULT_HK!=="undefined"?LIVE_RESULT_HK.latestResult:"----", color:"var(--color-hk)"},
        {key:"hklotto", name:"HK LOTTO", live:typeof LIVE_RESULT_HKLOTTO!=="undefined"?LIVE_RESULT_HKLOTTO.latestResult:"----", color:"var(--color-hk)"}
    ];
    document.getElementById("liveDrawGrid").innerHTML = data.map(e => {
        let n = e.live.split("").map(t => `<div class="num-box" style="color:${e.color}">${t}</div>`).join("");
        return `<div class="live-card"><div class="market-name" style="color:${e.color}">${e.name}</div><div style="display:flex;justify-content:center;gap:2px">${n}</div></div>`;
    }).join("");
}

document.addEventListener("DOMContentLoaded", ()=>{
    renderApp();
    
    // Ambil data dan balik urutannya agar index [0] adalah yang terbaru
    const dSdy = parseData(typeof DATA_PAITO_SDY!=="undefined"?DATA_PAITO_SDY:[]).reverse();
    const dSdyL = parseData(typeof DATA_PAITO_SDYLOTTO!=="undefined"?DATA_PAITO_SDYLOTTO:[]).reverse();
    const dSgp = parseData(typeof DATA_PAITO_SGP!=="undefined"?DATA_PAITO_SGP:[]).reverse();
    const dHk = parseData(typeof DATA_PAITO_HK!=="undefined"?DATA_PAITO_HK:[]).reverse();
    const dHkL = parseData(typeof DATA_PAITO_HKLOTTO!=="undefined"?DATA_PAITO_HKLOTTO:[]).reverse();
    
    const body = document.querySelector("#monthlyTable tbody");
    body.innerHTML = "";
    
    for(let r = 0; r < 15; r++){
        let d = new Date(); d.setDate(d.getDate()-r);
        let dateStr = `${String(d.getDate()).padStart(2,"0")}-${String(d.getMonth()+1).padStart(2,"0")}`;
        
        // Masing-masing pasaran mengambil data dari array-nya sendiri
        body.innerHTML += `<tr>
            <td class="date-col">${dateStr}</td>
            <td class="txt-sdy">${dSdy[r] || "-"}</td>
            <td class="txt-sdy">${dSdyL[r] || "-"}</td>
            <td class="txt-sgp">${dSgp[r] || "-"}</td>
            <td class="txt-hk">${dHk[r] || "-"}</td>
            <td class="txt-hk">${dHkL[r] || "-"}</td>
        </tr>`;
    }
});
</script>
</body>
</html>
