<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TARDAL - Angka Statistik</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:#fff;
padding:15px;
}

.container{
max-width:800px;
margin:auto;
background:#1e293b;
padding:20px;
border-radius:15px;
}

h2{
text-align:center;
margin-bottom:20px;
color:#38bdf8;
}

input{
width:100%;
height:55px;
border:none;
border-radius:10px;
padding:10px;
font-size:24px;
text-align:center;
letter-spacing:3px;
}

button{
width:100%;
height:50px;
border:none;
border-radius:8px;
margin-top:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.btn-proses{
background:#0ea5e9;
color:#fff;
}

.btn-hapus{
background:#ef4444;
color:#fff;
}

.btn-copy{
background:#22c55e;
color:#fff;
}

.section{
margin-top:20px;
background:#111827;
padding:15px;
border-radius:10px;
}

.section h3{
text-align:center;
margin-bottom:10px;
color:#38bdf8;
}

.total{
text-align:center;
margin-bottom:10px;
font-size:15px;
color:#cbd5e1;
}

.result{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
gap:8px;
max-height:350px;
overflow:auto;
}

.number{
background:#334155;
padding:10px;
border-radius:8px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.footer{
margin-top:20px;
text-align:center;
font-size:14px;
color:#94a3b8;
}
</style>
</head>

<body>

<div class="container">

<h2>Portal 4D</h2>

<input
type="text"
id="angka"
maxlength="8"
placeholder="MAX 8 DIGIT">

<button class="btn-proses" onclick="proses()">
TAMPILKAN HASIL
</button>

<button class="btn-hapus" onclick="hapusData()">
HAPUS
</button>

<div class="section">
<h3>LINE 4D</h3>
<div class="total" id="total4d">Total : 0</div>
<div class="result" id="hasil4d"></div>
<button class="btn-copy" onclick="copy4d()">
SALIN 4D
</button>
</div>

<div class="section">
<h3>LINE 3D</h3>
<div class="total" id="total3d">Total : 0</div>
<div class="result" id="hasil3d"></div>
<button class="btn-copy" onclick="copy3d()">
SALIN 3D
</button>
</div>

<div class="section">
<h3>LINE 2D</h3>
<div class="total" id="total2d">Total : 0</div>
<div class="result" id="hasil2d"></div>
<button class="btn-copy" onclick="copy2d()">
SALIN 2D
</button>
</div>

<div class="footer">
© TUNGGAL PAITO
</div>

</div>

<script>

let hasil4d=[];
let hasil3d=[];
let hasil2d=[];

function kombinasi(arr,panjang){

let hasil=[];

function rekursif(current,sisa){

if(current.length===panjang){
hasil.push(current.join(''));
return;
}

for(let i=0;i<sisa.length;i++){

let baru=[...sisa];
let ambil=baru.splice(i,1);

rekursif(
[...current,ambil[0]],
baru
);

}

}

rekursif([],arr);

return [...new Set(hasil)];

}

function shuffle(array){

for(let i=array.length-1;i>0;i--){

let j=Math.floor(Math.random()*(i+1));

[array[i],array[j]]=
[array[j],array[i]];

}

return array;

}

function proses(){

let angka=document
.getElementById("angka")
.value
.replace(/\D/g,'');

if(angka.length<2){

alert("Minimal 2 digit");
return;

}

if(angka.length>8){

alert("Maksimal 8 digit");
return;

}

let digit=angka.split('');

hasil4d=[];
hasil3d=[];
hasil2d=[];

if(digit.length>=4){

hasil4d=
shuffle(
kombinasi(digit,4)
);

}

if(digit.length>=3){

hasil3d=
shuffle(
kombinasi(digit,3)
);

}

hasil2d=
shuffle(
kombinasi(digit,2)
);

tampilkan();

}

function tampilkan(){

document.getElementById("hasil4d").innerHTML=
hasil4d.map(x=>
`<div class="number">${x}</div>`
).join('');

document.getElementById("hasil3d").innerHTML=
hasil3d.map(x=>
`<div class="number">${x}</div>`
).join('');

document.getElementById("hasil2d").innerHTML=
hasil2d.map(x=>
`<div class="number">${x}</div>`
).join('');

document.getElementById("total4d").innerHTML=
"Total : "+hasil4d.length;

document.getElementById("total3d").innerHTML=
"Total : "+hasil3d.length;

document.getElementById("total2d").innerHTML=
"Total : "+hasil2d.length;

}

function copy4d(){

if(!hasil4d.length){
alert("Tidak ada data 4D");
return;
}

navigator.clipboard.writeText(
hasil4d.join("\n")
);

alert("4D berhasil disalin");

}

function copy3d(){

if(!hasil3d.length){
alert("Tidak ada data 3D");
return;
}

navigator.clipboard.writeText(
hasil3d.join("\n")
);

alert("3D berhasil disalin");

}

function copy2d(){

if(!hasil2d.length){
alert("Tidak ada data 2D");
return;
}

navigator.clipboard.writeText(
hasil2d.join("\n")
);

alert("2D berhasil disalin");

}

function hapusData(){

document.getElementById("angka").value="";

hasil4d=[];
hasil3d=[];
hasil2d=[];

document.getElementById("hasil4d").innerHTML="";
document.getElementById("hasil3d").innerHTML="";
document.getElementById("hasil2d").innerHTML="";

document.getElementById("total4d").innerHTML="Total : 0";
document.getElementById("total3d").innerHTML="Total : 0";
document.getElementById("total2d").innerHTML="Total : 0";

}

document
.getElementById("angka")
.addEventListener("keypress",function(e){

if(e.key==="Enter"){

e.preventDefault();
proses();

}

});
</script>

</body>
</html>
